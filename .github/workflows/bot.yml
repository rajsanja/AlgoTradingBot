name: Hourly Trading Bot

on:
  schedule:
    - cron: '0 * * * *' # Runs at exactly the top of every hour
  workflow_dispatch: # Allows you to test it manually whenever you want

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_SECRET_KEY: ${{ secrets.BINANCE_TESTNET_SECRET_KEY }}
          GITHUB_ACTIONS: "true"
        run: python live_paper_bot.py
